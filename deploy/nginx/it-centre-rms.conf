server {
    listen 80;
    server_name rms.university.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rms.university.local;

    ssl_certificate /etc/ssl/certs/rms.university.local.crt;
    ssl_certificate_key /etc/ssl/private/rms.university.local.key;

    client_max_body_size 12m;

    location /static/ {
        alias /srv/it-centre-rms/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/it-centre-rms/media/;
        internal;
    }

    location / {
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/it-centre-rms/gunicorn.sock;
    }
}
